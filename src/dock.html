<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Termix — alternador</title>
<style>
:root{--text:#EEF2F8;--text2:#A9B3C4;--text3:#6F7A8E;--accent:#5B9DFF;--warn:#FBBF24;--border2:rgba(255,255,255,.22);--sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;user-select:none}
body{display:flex;align-items:center;justify-content:center;font:13px var(--sans);color:var(--text)}
.pill{display:flex;align-items:center;gap:4px;padding:5px;border-radius:99px;background:rgba(12,17,28,.86);border:1px solid var(--border2);
  box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);transition:opacity .2s}
body.fade .pill{opacity:.45}body.fade .pill:hover{opacity:1}
button{display:flex;align-items:center;gap:7px;height:34px;padding:0 15px 0 12px;border:0;border-radius:99px;background:none;color:var(--text2);font:inherit;cursor:pointer;white-space:nowrap}
button:hover{color:var(--text);background:rgba(255,255,255,.08)}
button.on{background:rgba(91,157,255,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(91,157,255,.55)}
svg{width:17px;height:17px;flex:none}
.n{min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px;font-size:11px;font-weight:600;background:rgba(255,255,255,.14);color:var(--text)}
.nd{width:9px;height:9px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.28);animation:nd 1.6s ease-in-out infinite;flex:none}
@keyframes nd{50%{box-shadow:0 0 0 6px rgba(74,222,128,0)}}
@media (prefers-reduced-motion:reduce){.nd{animation:none}}
.n.att{background:var(--warn);color:#1a1408}
</style>
</head>
<body>
<div class="pill" id="pill"></div>
<script src="dock.js"></script>
</body>
</html>

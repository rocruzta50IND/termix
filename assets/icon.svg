<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7db6ff"/>
      <stop offset=".5" stop-color="#3563e6"/>
      <stop offset="1" stop-color="#16248a"/>
    </linearGradient>
    <radialGradient id="hi" cx=".28" cy=".16" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prompt" gradientUnits="userSpaceOnUse" x1="70" y1="100" x2="200" y2="200">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4e2ff"/>
    </linearGradient>
    <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a1250" flood-opacity=".55"/></filter>
  </defs>

  <rect x="10" y="10" width="236" height="236" rx="60" fill="url(#tile)"/>
  <rect x="10" y="10" width="236" height="236" rx="60" fill="url(#hi)"/>

  <!-- barra de abas: três abas com as cores do app -->
  <circle cx="56" cy="52" r="7" fill="#22d3ee"/>
  <circle cx="80" cy="52" r="7" fill="#a78bfa"/>
  <circle cx="104" cy="52" r="7" fill="#4ade80"/>
  <path d="M34 78H222" stroke="#fff" stroke-opacity=".26" stroke-width="2.5" stroke-linecap="round"/>

  <!-- prompt: brilho por trás e traço por cima -->
  <g filter="url(#blur)" opacity=".75">
    <path d="M76 112l54 40-54 40" fill="none" stroke="#bfe3ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M146 196h52" fill="none" stroke="#bfe3ff" stroke-width="24" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M76 112l54 40-54 40" fill="none" stroke="url(#prompt)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M146 196h52" fill="none" stroke="url(#prompt)" stroke-width="22" stroke-linecap="round"/>
  </g>

  <path d="M10 76a60 60 0 0 1 60-66h116a60 60 0 0 1 60 66v10C196 118 60 118 10 86z" fill="url(#gloss)"/>
  <rect x="10.75" y="10.75" width="234.5" height="234.5" rx="59.25" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="1.5"/>
  <rect x="14" y="14" width="228" height="228" rx="56" fill="none" stroke="#0a1250" stroke-opacity=".25" stroke-width="2"/>
</svg>

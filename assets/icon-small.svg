      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#t)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="url(#r)" stroke-width="3"/>
  <path d="M17 18l16 14-16 14" fill="none" stroke="url(#p)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37 47h12" fill="none" stroke="url(#p)" stroke-width="9" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- versão para tamanhos pequenos (16 a 32 px): fundo escuro, borda azul luminosa e prompt bem grosso -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22336a"/>
      <stop offset="1" stop-color="#050813"/>
    </linearGradient>
    <linearGradient id="r" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="62" y2="62">
      <stop offset="0" stop-color="#a8d0ff"/>
      <stop offset=".5" stop-color="#4b7bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="p" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="50" y2="48">

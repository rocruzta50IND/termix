<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termix — chat no lugar do terminal (A e B)</title>
<style>
/* Protótipo 3 da TASK-040: o app fica COMO ESTÁ (barra lateral, abas com terminais e chats misturados, barra de baixo flutuante, rail); só a área do terminal muda. Dois estilos de chat para comparar. Antes: clona o layout atual do Termix (vidro, barra lateral, abas encaixadas, rail) e troca a área do terminal por uma conversa em bolhas.
   Não é o app: o texto da resposta é simulado aqui; no app ele vem do stream-json do Claude Code. */
:root{--text:#EEF2F8;--text2:#A9B3C4;--text3:#6F7A8E;--accent:#5B9DFF;--ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);--border:rgba(255,255,255,.13);--border2:rgba(255,255,255,.22);
  --term:#0a0a17;--bar-bg:#06070f;--tc:#5B9DFF;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;--sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#05070b;color:var(--text);font:14px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.bg{position:fixed;inset:8px;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#080b11,#04060a 60%,#06090e)}
.bg i{position:absolute;border-radius:50%}
.b1{width:860px;height:760px;left:-260px;top:-240px;background:radial-gradient(closest-side,rgba(37,99,235,.42),rgba(37,99,235,.21) 55%,transparent)}
.b2{width:820px;height:820px;right:-300px;top:-4%;background:radial-gradient(closest-side,rgba(100,116,139,.38),rgba(100,116,139,.19) 55%,transparent)}
.b3{width:900px;height:700px;left:20%;bottom:-340px;background:radial-gradient(closest-side,rgba(14,116,144,.36),rgba(14,116,144,.18) 55%,transparent)}
.bg::after{content:"";position:absolute;inset:0;background:rgba(3,4,8,.3)}
#frame{position:absolute;inset:8px;border-radius:22px;border:1px solid rgba(255,255,255,.2);overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 46%,rgba(255,255,255,.08));box-shadow:0 26px 60px rgba(0,0,0,.55)}
/* barra superior */
#topbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 0 0 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px}
.brand svg{width:26px;height:26px}
.sp{flex:1}
.bell{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--glass);display:grid;place-items:center;color:var(--text2)}
.wc{display:flex}.wc span{width:50px;display:grid;place-items:center;color:var(--text2);font-size:14px}
/* barra lateral */
.side{position:absolute;left:0;top:46px;bottom:12px;width:244px;display:flex;flex-direction:column;padding:6px 10px 8px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--text3);padding:10px 10px 6px}
.ph{display:flex;align-items:center;gap:8px;padding:7px 10px;font-weight:600;color:var(--text2)}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 12px;border-radius:11px;color:var(--text2);text-align:left}
.item:hover{background:var(--glass);color:var(--text)}
.item.active{background:var(--glass2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
.item svg{width:17px;height:17px;flex:none}
.item .cnt{margin-left:auto;font-size:11px;color:var(--text3);background:rgba(255,255,255,.08);padding:1px 7px;border-radius:99px}
.item .new{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.4px;color:#06101f;background:var(--accent);padding:1px 7px;border-radius:99px}
.newproj{border:1px dashed var(--border2);border-radius:12px;padding:8px;color:var(--text2);text-align:center;margin:8px 0 0}
/* palco */
.col{position:absolute;left:244px;right:12px;top:46px;bottom:12px}
.stage{position:absolute;inset:0;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:var(--term);display:flex;flex-direction:column}
/* abas encaixadas */
.tabsbar{position:relative;display:flex;align-items:flex-end;min-height:36px;padding:0 8px 0 0;background:var(--bar-bg);flex:none}
.tab{position:relative;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;border-radius:8px 8px 0 0;color:var(--text3);flex:0 1 210px;min-width:34px;font-size:13px;white-space:nowrap}
.tab:first-child{padding-left:18px}
.tab .nm{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex:none}
.tab .md{font-size:10px;font-weight:700;letter-spacing:.3px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.09);color:var(--text2)}
.tab .x{width:22px;height:22px;display:grid;place-items:center;color:var(--text3);opacity:0}
.tab:not(.active){background:linear-gradient(165deg,color-mix(in srgb,var(--c) 11%,transparent),color-mix(in srgb,var(--c) 3%,transparent) 65%,transparent)}
.tab+.tab::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:1px;background:rgba(255,255,255,.3)}
.tab.active{color:#fff;z-index:2;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 52%,transparent),color-mix(in srgb,var(--c) 24%,transparent) 45%,transparent),var(--term)}
.tab.active::before,.tab.active+.tab::before{display:none}
.tab.active .x{opacity:1}
.tab.active .md{background:color-mix(in srgb,var(--c) 40%,transparent);color:#fff}
.tab.active .dot{background:var(--ok);animation:pulse 1.4s ease-in-out infinite}
.tab.active::after{content:"";position:absolute;right:-8px;bottom:0;width:8px;height:8px;background:radial-gradient(circle at 100% 0,var(--bar-bg) 7.5px,var(--term) 8px)}
.tabsbar .plus{width:34px;height:34px;display:grid;place-items:center;align-self:center;color:var(--text2);font-size:18px}
.tctl{display:flex;align-items:center;gap:12px;align-self:center;font-size:13px;color:var(--text2)}
.state{white-space:nowrap;display:flex;align-items:center;gap:8px}.state .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* alternador Terminal | Chat (por aba) */
.seg{display:flex;padding:2px;border-radius:99px;border:1px solid var(--border);background:var(--glass)}
.seg button{padding:3px 12px;border-radius:99px;font-size:12px;color:var(--text3)}
.seg button.on{background:var(--glass2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
/* chat */
.sess{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:22px 96px 8px 0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.thread{max-width:820px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700}
.row.ai .av{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
.row.me .av{background:var(--glass2);color:var(--text2)}
.bub{max-width:calc(100% - 44px);padding:11px 15px;border-radius:16px;line-height:1.55;user-select:text;font-size:14px}
.row.ai .bub{background:rgba(255,255,255,.055);border:1px solid var(--border);border-top-left-radius:6px}
.row.me .bub{background:linear-gradient(135deg,rgba(91,157,255,.34),rgba(59,110,230,.24));border:1px solid rgba(91,157,255,.4);border-top-right-radius:6px}
.bub>*:first-child{margin-top:0}.bub>*:last-child{margin-bottom:0}
.bub p{margin:.5em 0}
.bub h1,.bub h2,.bub h3{margin:.8em 0 .35em;line-height:1.25;font-weight:650}
.bub h1{font-size:18px}.bub h2{font-size:16px}.bub h3{font-size:14.5px}
.bub ul,.bub ol{margin:.45em 0;padding-left:1.35em}.bub li{margin:.2em 0}
.bub a{color:var(--accent);text-decoration:none}.bub a:hover{text-decoration:underline}
.bub blockquote{margin:.6em 0;padding:2px 12px;border-left:3px solid var(--border2);color:var(--text2)}
.bub hr{border:0;border-top:1px solid var(--border);margin:.9em 0}
.bub code{font-family:var(--mono);font-size:12.5px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px}
.bub table{border-collapse:collapse;margin:.6em 0;font-size:13px}.bub th,.bub td{border:1px solid var(--border);padding:5px 10px;text-align:left}.bub th{background:rgba(255,255,255,.06)}
.code{margin:.6em 0;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:rgba(0,0,0,.38)}
.code .ch{display:flex;align-items:center;justify-content:space-between;padding:5px 8px 5px 12px;background:rgba(255,255,255,.06);font-size:11.5px;color:var(--text3)}
.code .ch button{font-size:11.5px;color:var(--text2);padding:2px 8px;border-radius:7px}.code .ch button:hover{background:var(--glass2);color:var(--text)}
.code pre{padding:10px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.k{color:#c4a7ff}.s{color:#86e0a6}.c{color:#6F7A8E}.f{color:#7cc4ff}
.caret{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--accent);border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* ferramentas */
.tool{margin:2px 0 0 42px;max-width:calc(100% - 42px);border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.035);overflow:hidden;font-size:13px}
.tool summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;color:var(--text2)}
.tool summary::-webkit-details-marker{display:none}
.tool .ti{width:22px;height:22px;border-radius:7px;background:rgba(91,157,255,.18);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.tool .tn{font-weight:600;color:var(--text)}.tool .ta{font-family:var(--mono);font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tool .ts{font-size:11.5px;color:var(--ok)}
.tool .tb{padding:8px 12px 10px;border-top:1px solid var(--border);font-family:var(--mono);font-size:12px;color:var(--text2);white-space:pre-wrap;max-height:140px;overflow:auto}
.tool.run .ts{color:var(--warn)}
.sys{align-self:center;font-size:12px;color:var(--text3);background:var(--glass);border:1px solid var(--border);border-radius:99px;padding:3px 12px}
/* campo de envio */
.composer{padding:8px 96px 66px 0}
.cbox{max-width:820px;margin:0 auto 0;padding:0 28px}
.cin{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 16px;border-radius:18px;border:1px solid var(--border2);background:rgba(255,255,255,.06);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.cin:focus-within{border-color:rgba(91,157,255,.7);box-shadow:0 0 0 3px rgba(91,157,255,.18),0 8px 28px rgba(0,0,0,.35)}
.cin textarea{flex:1;resize:none;background:none;border:0;outline:0;color:var(--text);font:14px/1.5 var(--sans);max-height:160px;min-height:24px;padding:4px 0;user-select:text}
.cin textarea::placeholder{color:var(--text3)}
.send{width:36px;height:36px;border-radius:12px;background:var(--accent);color:#06101f;display:grid;place-items:center;flex:none}
.send:disabled{background:var(--glass2);color:var(--text3);cursor:default}
.cmeta{display:flex;align-items:center;gap:10px;margin-top:8px;padding:0 6px;font-size:11.5px;color:var(--text3);flex-wrap:wrap}
.chip{padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--border)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.4)}
/* rail à direita (igual ao do app) */
.rail{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:72px;padding:14px 0 10px;border-radius:36px;border:1px solid var(--border);background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--text2);background:conic-gradient(var(--rc) calc(var(--v)*1%),rgba(255,255,255,.08) 0)}
.ring b{width:36px;height:36px;border-radius:50%;background:#0b0c19;display:grid;place-items:center;font-weight:600}
.rl{font-size:9.5px;letter-spacing:.8px;color:var(--text3);margin-top:-8px;text-transform:uppercase}
.dockrow{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6}
.pill{display:flex;align-items:center;gap:4px;padding:5px;border-radius:99px;background:rgba(12,17,28,.86);border:1px solid var(--border2);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.pill button{display:flex;align-items:center;gap:7px;height:34px;padding:0 15px 0 12px;border-radius:99px;color:var(--text2);font-size:13px;white-space:nowrap}
.pill button:hover{color:var(--text);background:rgba(255,255,255,.08)}
.pill button.on{background:rgba(91,157,255,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(91,157,255,.55)}
.pill svg{width:17px;height:17px;flex:none}
.pill .n{min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px;font-size:11px;font-weight:600;background:rgba(255,255,255,.14)}
.pill .n.att{background:var(--warn);color:#1a1408}
.pill .nd{width:9px;height:9px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.28)}
.sepd{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 4px}
.rmeta{font-size:11.5px;color:var(--text3);background:rgba(14,19,30,.7);border:1px solid var(--border);border-radius:99px;padding:3px 12px;white-space:nowrap}
.rmeta .m{color:#5fd0c4}.rmeta .b{color:var(--ok)}.rmeta .w{color:var(--warn)}
.fterm{flex:1;padding:16px 22px;font-family:var(--mono);font-size:13px;line-height:1.5;color:#d6dbe6;white-space:pre-wrap;overflow:hidden;user-select:text}
.conf{flex:1;overflow:auto;padding:26px 34px;max-width:860px}
.conf h2{font-size:20px;margin-bottom:4px}.conf .sub{color:var(--text3);margin-bottom:22px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 18px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.04);margin-bottom:12px}
.crow b{display:block;font-weight:600;margin-bottom:2px}.crow span.d{color:var(--text3);font-size:12.5px}
.seg{display:flex;padding:2px;border-radius:99px;border:1px solid var(--border);background:var(--glass);flex:none}
.seg button{padding:4px 12px;border-radius:99px;font-size:12px;color:var(--text3)}
.seg button.on{background:var(--glass2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
.sess{--tc:#5B9DFF}
.sess.sb .thread{max-width:860px;gap:0}
.sess.sb .row{flex-direction:column!important;gap:5px;align-items:stretch;padding:18px 0 18px 20px;border-left:2px solid transparent}
.sess.sb .row.me{border-left-color:var(--tc);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 16%,transparent),transparent 78%)}
.sess.sb .row.ai{border-left-color:var(--border)}
.sess.sb .av{width:auto;height:auto;background:none!important;border-radius:0;font-size:0;display:block;color:transparent}
.sess.sb .av::after{font-size:11px;letter-spacing:.9px;text-transform:uppercase;font-weight:650;color:var(--text3)}
.sess.sb .row.me .av::after{content:"Você";color:var(--tc)}
.sess.sb .row.ai .av::after{content:"Claude"}
.sess.sb .bub{max-width:100%;background:none!important;border:0!important;border-radius:0;padding:0;font-size:14.5px;line-height:1.68}
.sess.sb .row.me .bub{color:var(--text)}
.sess.sb .tool{margin:0 0 0 22px;max-width:calc(100% - 22px);border:0;border-left:2px solid var(--border2);border-radius:0;background:none}
.sess.sb .tool summary{padding:4px 10px}
.sess.sb .sys{margin:6px 0}
.sess.sb .cin{border-radius:14px;background:rgba(255,255,255,.035);box-shadow:none;border-color:var(--border)}
.sess.sb .cin:focus-within{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 22%,transparent)}
.note{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;font-size:12px;color:var(--text2);background:rgba(8,12,20,.85);border:1px solid var(--border2);padding:6px 14px;border-radius:99px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div id="frame">
  <header id="topbar">
    <div class="brand"><svg viewBox="0 0 32 32" fill="none"><path d="M5 9l8 7-8 7" stroke="#8cc0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 24h11" stroke="#8cc0ff" stroke-width="3" stroke-linecap="round"/></svg>Termix</div>
    <span class="sp"></span>
    <span class="bell"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></span>
    <span class="wc"><span>—</span><span>▢</span><span>✕</span></span>
  </header>

  <aside class="side">
    <div class="label">Projetos</div>
    <div class="ph">⌄ Termix</div>
    <button class="item active" id="navchat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 10l3 2-3 2M13 15h4"/></svg><span id="navlbl">Terminais</span><span class="cnt">3</span></button>
    <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></svg>Plugins</button>
    <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Skills</button>
    <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 8l3.5 8M16.5 8L13 16"/></svg>MCPs</button>
    <button class="newproj">+ Novo projeto</button>
    <span class="sp"></span>
    <div class="label">Geral</div>
    <button class="item">Consumo</button><button class="item">Integrações</button><button class="item" id="navconf">Configurações</button>
  </aside>

  <section class="col"><div class="stage">
    <div class="tabsbar">
      <button class="tab active" style="--c:#5B9DFF"><i class="dot"></i><span class="nm">Brain - Termix</span><span class="md">CHAT</span><span class="x">×</span></button>
      <button class="tab" style="--c:#FB923C"><i class="dot"></i><span class="nm">Coder - Termix</span><span class="md">TERM</span></button>
      <button class="tab" style="--c:#A78BFA"><i class="dot"></i><span class="nm">Revisor - Termix</span><span class="md">CHAT</span></button>
      <button class="plus">+</button>
      <span class="sp"></span>
      <div class="tctl">
        <div class="seg" id="styleseg" title="Só do protótipo: compara os dois estilos de chat"><button data-s="a" class="on">Estilo A · bolhas</button><button data-s="b">Estilo B · fluxo</button></div><span class="state"><i class="dot"></i><span id="st">Trabalhando</span></span>
      </div>
    </div>

    <div class="sess" id="sessv">
      <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>

<script>
/* ---- Markdown mínimo e seguro (escapa o HTML antes de tudo; o mesmo renderizador iria para o app) ---- */
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hl(code, lang) {
  let h = esc(code);
  if (/^(js|javascript|ts|json)$/.test(lang || '')) {
    h = h.replace(/(\/\/.*$)/gm, '<span class="c">$1</span>')
         .replace(/(&quot;[^&\n]*?&quot;|'[^'\n]*'|`[^`\n]*`)/g, '<span class="s">$1</span>')
         .replace(/\b(const|let|var|function|return|if|else|await|async|for|of|new|import|from|require)\b/g, '<span class="k">$1</span>')
         .replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="f">$1</span>');
  }
  return h;
}
function inline(t) {
  t = esc(t);
  const codes = []; t = t.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n'); let out = '', i = 0;
  while (i < lines.length) {
    const L = lines[i];
    let m;
    if ((m = L.match(/^```(\w*)/))) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      const closed = i < lines.length; i++;
      out += `<div class="code"><div class="ch"><span>${esc(m[1] || 'texto')}</span><button>Copiar</button></div><pre>${hl(buf.join('\n'), m[1])}${closed ? '' : ''}</pre></div>`; continue;
    }
    if ((m = L.match(/^(#{1,3})\s+(.*)/))) { out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^---+\s*$/.test(L)) { out += '<hr>'; i++; continue; }
    if (/^>\s?/.test(L)) { const b = []; while (i < lines.length && /^>\s?/.test(lines[i])) b.push(lines[i++].replace(/^>\s?/, '')); out += `<blockquote>${inline(b.join(' '))}</blockquote>`; continue; }
    if (/^\s*[-*]\s+/.test(L) || /^\s*\d+[.)]\s+/.test(L)) {
      const ord = /^\s*\d+[.)]/.test(L), it = [];
      while (i < lines.length && (ord ? /^\s*\d+[.)]\s+/ : /^\s*[-*]\s+/).test(lines[i])) it.push(lines[i++].replace(/^\s*(\d+[.)]|[-*])\s+/, ''));
      out += `<${ord ? 'ol' : 'ul'}>${it.map((x) => `<li>${inline(x)}</li>`).join('')}</${ord ? 'ol' : 'ul'}>`; continue;
    }
    if (/^\|.*\|\s*$/.test(L) && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      const row = (s) => s.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const head = row(L); i += 2; const body = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out += `<table><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`; continue;
    }
    if (!L.trim()) { i++; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(```|#{1,3}\s|>|\s*[-*]\s|\s*\d+[.)]\s|---)/.test(lines[i])) p.push(lines[i++]);
    out += `<p>${inline(p.join(' '))}</p>`;
  }
  return out;
}

/* ---- conversa de exemplo (já no formato do que o stream-json entrega: texto, ferramenta, resultado) ---- */
const thread = document.getElementById('thread'), scroll = document.getElementById('scroll');
const bottom = () => { scroll.scrollTop = scroll.scrollHeight; };
function addMe(text) { const r = document.createElement('div'); r.className = 'row me'; r.innerHTML = `<div class="av">EU</div><div class="bub">${md(text)}</div>`; thread.appendChild(r); bottom(); }
function addAi() { const r = document.createElement('div'); r.className = 'row ai'; r.innerHTML = '<div class="av">C</div><div class="bub"></div>'; thread.appendChild(r); return r.querySelector('.bub'); }
function addTool(name, arg, body, done = true) {
  const d = document.createElement('details'); d.className = 'tool' + (done ? '' : ' run');
  d.innerHTML = `<summary><span class="ti">${name[0]}</span><span class="tn">${name}</span><span class="ta">${esc(arg)}</span><span class="ts">${done ? '✓ concluído' : 'executando…'}</span></summary><div class="tb">${esc(body)}</div>`;
  thread.appendChild(d); bottom(); return d;
}
const sys = (t) => { const s = document.createElement('div'); s.className = 'sys'; s.textContent = t; thread.appendChild(s); };

sys('Conversa retomada · sessão 4d07cbdc');
addMe('Leia o `package.json` e me diga a versão e os scripts.');
addTool('Read', 'package.json', '{\n  "name": "termix",\n  "version": "0.1.1",\n  "scripts": { "start": "electron .", "check": "node --check …", "dist": "electron-builder", "release": "…" }\n}');
addAi().innerHTML = md(`A versão atual é **0.1.1**. Os scripts principais:

| Script | O que faz |
|---|---|
| \`npm start\` | abre o app em desenvolvimento |
| \`npm run check\` | checagem de sintaxe dos arquivos JS |

| \`npm run release\` | publica o Release no GitHub |

> O próximo lançamento deve usar **0.1.2** ou maior, porque a 0.1.1 já está pública.`);
addMe('Mostre como eu leria um evento do stream em JavaScript.');
addAi().innerHTML = md(`Cada linha da saída é um JSON. Um exemplo mínimo:

\`\`\`js
// lê o stdout do processo, uma linha por vez
const ev = JSON.parse(line);
if (ev.type === 'stream_event' && ev.event.delta?.type === 'text_delta') {
  bubble.append(ev.event.delta.text); // texto chegando aos pedaços
}
\`\`\`

Três coisas importam:

1. **\`text_delta\`** — pedaços do texto da resposta;
2. **\`tool_use\`** e **\`tool_result\`** — viram os cartões de ferramenta;
3. **\`result\`** — fecha o turno, com custo e uso.`);

/* ---- resposta simulada em stream ---- */
const REPLY = `Entendi. Vou olhar o arquivo e já te respondo.

Resumo do que vejo:

- o texto chega **aos pedaços**, como em um chat web;
- cartões de ferramenta aparecem **no meio** da resposta;
- blocos de código ganham botão de copiar.

\`\`\`js
console.log('olá, Termix');
\`\`\`
`;
let busy = false;
const inp = document.getElementById('inp'), btn = document.getElementById('send'), st = document.getElementById('st');
function setBusy(b) { busy = b; btn.disabled = b; st.textContent = b ? 'Trabalhando' : 'Aguardando você'; }
async function reply() {
  setBusy(true);
  await new Promise((r) => setTimeout(r, 500));
  const tool = addTool('Grep', 'TODO em src/', 'procurando…', false);
  await new Promise((r) => setTimeout(r, 900));
  tool.classList.remove('run'); tool.querySelector('.ts').textContent = '✓ concluído'; tool.querySelector('.tb').textContent = 'src/renderer/app.js:1884: /* arrastar abas */\n(2 resultados)';
  const b = addAi(); let acc = '';
  for (const ch of REPLY) { acc += ch; b.innerHTML = md(acc) + '<span class="caret"></span>'; if (Math.random() < .5) bottom(); await new Promise((r) => setTimeout(r, 12)); }
  b.innerHTML = md(acc); bottom(); setBusy(false);
}
function submit() { const t = inp.value.trim(); if (!t || busy) return; inp.value = ''; inp.style.height = 'auto'; addMe(t); reply(); }
btn.onclick = submit;
inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px'; });
const sessv = document.getElementById('sessv');
document.getElementById('styleseg').addEventListener('click', (e) => { const x = e.target.closest('button'); if (!x) return; sessv.classList.toggle('sb', x.dataset.s === 'b'); document.querySelectorAll('#styleseg button').forEach((k) => k.classList.toggle('on', k === x)); bottom(); });
setBusy(false); bottom();
</script>
